# Codex CLI 0.128.0+ "Ralph loop" experiment.
# Enables persistent thread goals so Codex can keep working across turns until
# the goal is completed, paused, cleared, or budget-limited.
# ralph-loop.config.toml
model = "gpt-5.5"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"
model_verbosity = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

project_doc_max_bytes = 131072
tool_output_token_limit = 12000
background_terminal_max_timeout = 1800000

[history]
persistence = "save-all"
max_bytes = 536870912

[features]
goals = true
